<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5c842">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flan Lab">
<title>Cinética del Flan</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0f0a04;color:#f0e6d3;font-family:'Lato',sans-serif;overflow-x:hidden}
  input[type=range]{width:100%;height:36px;cursor:pointer;accent-color:#f5c842;background:transparent}
  input[type=range]::-webkit-slider-thumb{width:22px;height:22px}
  .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;margin-bottom:12px}
  .section-title{font-family:'Playfair Display',serif;font-size:15px;margin-bottom:12px}
  .mono{font-family:monospace}
  .tab-btn{flex:1;padding:10px 4px;border:none;border-radius:10px;font-size:12px;font-family:'Lato',sans-serif;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px}
  .alert{border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:11px;font-family:monospace}
  button:active{transform:scale(0.97)}
  .pill{font-size:9px;border-radius:20px;padding:2px 7px;font-family:monospace}
  .sim-btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;font-family:'Lato',sans-serif;letter-spacing:0.5px;transition:all 0.3s;cursor:pointer;margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA & SCIENCE MODEL
// ═══════════════════════════════════════════════════════
const PROTEINS = [
  { id:"ovotransferrin", name:"Ovotransferrina",    source:"Clara",      startTemp:57,  fullTemp:65,  color:"#f0e6d3", structural:true,  optimalMin:100, optimalMax:100, optimalNote:"Completa a 65°C",                lowMsg:"Estructura inicial ausente",       highMsg:null },
  { id:"ovalbumin",      name:"Ovoalbúmina",        source:"Clara",      startTemp:62,  fullTemp:78,  color:"#e8d5b7", structural:true,  optimalMin:80,  optimalMax:95,  optimalNote:"100% = sobrecocción",             lowMsg:"Sin firmeza suficiente",           highMsg:"Sobrecocción · textura granular" },
  { id:"yolk",           name:"Lipoproteínas yema", source:"Yema",       startTemp:65,  fullTemp:70,  color:"#f5c842", structural:true,  optimalMin:100, optimalMax:100, optimalNote:"Completa a 70°C",                lowMsg:"Sin cremosidad",                   highMsg:null },
  { id:"lecithin",       name:"Lecitina",           source:"Yema extra", startTemp:999, fullTemp:999, color:"#fb923c", structural:false, optimalMin:null,optimalMax:null, optimalNote:"Escala con yemas extra",         lowMsg:null,                               highMsg:null },
  { id:"casein",         name:"Caseína",            source:"Leche",      startTemp:999, fullTemp:999, color:"#86efac", structural:false, optimalMin:null,optimalMax:null, optimalNote:"Siempre ~15% · no coagula",     lowMsg:null,                               highMsg:null },
];
const MOLDS = {
  individual:{ id:"individual", name:"Individual",   icon:"🍮", desc:"~120 ml · Ø7cm",       thermalDepth:3.0, svRatio:1.8,  maxCapacity:130,  portions:1, shape:"cylinder" },
  medium:    { id:"medium",     name:"Mediana",      icon:"🥧", desc:"16cm · ~600ml",         thermalDepth:5.5, svRatio:0.95, maxCapacity:650,  portions:4, shape:"cylinder" },
  large:     { id:"large",      name:"Grande cónica",icon:"🎂", desc:"20cm cónica · ~1400ml", thermalDepth:8.0, svRatio:0.60, maxCapacity:1500, portions:8, shape:"cone"     },
};
const METHODS = {
  banomaria:{ id:"banomaria", name:"Baño María",    icon:"🫙", maxSurfaceTemp:95,  gradient:0.12, heatMultiplier:1.0 },
  horno:    { id:"horno",     name:"Horno directo", icon:"🔥", maxSurfaceTemp:180, gradient:0.45, heatMultiplier:1.6 },
};
const WHOLE_EGG_MASS=63, YOLK_MASS=22;
const WHOLE_EGG ={water:0.730,protein:0.133,fat:0.115,yolkFraction:0.35};
const EXTRA_YOLK={water:0.490,protein:0.157,fat:0.315,lecithin:0.082};
const MILK      ={water:0.875,protein:0.033,fat:0.035};
const T_EGG_MIN=0.028,T_EGG_WARN=0.035,T_CREMOSO_MAX=0.065,T_FIRME_MAX=0.090;

function getCenterTemp(oT,mold,method,t){
  const mS=Math.min(oT,method.maxSurfaceTemp);
  const pr=mold.svRatio*method.heatMultiplier*0.08;
  const tf=1-Math.exp(-pr*t);
  const gl=mold.thermalDepth*method.gradient*(1-tf*0.5);
  return Math.max(20,Math.min(mS,20+(mS-20-gl)*tf));
}
function getSurfaceTemp(oT,method){return Math.min(oT,method.maxSurfaceTemp);}
function getTimeToSet(oT,mold,method){
  for(let t=1;t<=120;t++) if(getCenterTemp(oT,mold,method,t)>=75) return t;
  return 121;
}
function isOvercooked(cT,tMin,tts){
  const x=tMin-tts;
  return cT>90||(cT>85&&x>15)||(cT>78&&x>40);
}
function isRisky(cT,tMin,tts){
  const x=tMin-tts;
  return (cT>85&&x>5)||(cT>78&&x>20);
}
function getCoagulation(p,temp,se,eyf){
  if(p.id==="casein")   return 0.15;
  if(p.id==="lecithin") return Math.min(1,eyf*1.2);
  const s=p.startTemp+se,f=p.fullTemp+se;
  if(temp<=s) return 0; if(temp>=f) return 1;
  return (temp-s)/(f-s);
}
function getTexture(cm,sr,eyf,cT,tMin,tts){
  const {ovotransferrin:ot,ovalbumin:oa,yolk:yk,lecithin:lc}=cm;
  const yb=Math.min(0.28,eyf*0.14);
  const cs=ot*0.20+oa*(0.60-yb)+yk*(0.20+yb);
  const er=sr-lc*0.08;
  if(cs<0.20) return{label:"Líquido",      color:"#94a3b8",emoji:"💧",set:false};
  if(cs<0.42) return{label:"Semi-líquido", color:"#60a5fa",emoji:"🌊",set:false};
  if(cs<0.55) return{label:"Cuajando...",  color:"#a3e635", emoji:"⏳",set:false};
  if(isOvercooked(cT,tMin,tts)) return{label:"Sobrecocido",           color:"#ef4444",emoji:"❌",set:true};
  if(isRisky(cT,tMin,tts))      return{label:"Riesgo sobrecocción",   color:"#f97316",emoji:"⚠️",set:true};
  if(er<T_CREMOSO_MAX) return{label:"Cremoso perfecto",color:"#34d399",emoji:"✨",set:true};
  if(er<T_FIRME_MAX)   return{label:"Firme ideal",     color:"#fbbf24",emoji:"🍮",set:true};
  return                     {label:"Duro",            color:"#ef4444",emoji:"🪨",set:true};
}

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const state = {
  eggs:3, extraYolks:0, milk:500, sugar:150,
  ovenTemp:80, time:40, moldId:"medium", methodId:"banomaria",
  tab:"params",       // params | results
  animating:false, currentTime:0, animInterval:null
};

function derive(s){
  const mold=MOLDS[s.moldId], method=METHODS[s.methodId];
  const em=s.eggs*WHOLE_EGG_MASS, eym=s.extraYolks*YOLK_MASS;
  const tm=em+eym+s.milk+s.sugar;
  const water    =(em*WHOLE_EGG.water  +eym*EXTRA_YOLK.water  +s.milk*MILK.water) /tm;
  const eggProt  =(em*WHOLE_EGG.protein+eym*EXTRA_YOLK.protein)                   /tm;
  const casein   =(s.milk*MILK.protein)                                            /tm;
  const fat      =(em*WHOLE_EGG.fat    +eym*EXTRA_YOLK.fat    +s.milk*MILK.fat)   /tm;
  const sugarC   =s.sugar/tm;
  const lecithin =(eym*EXTRA_YOLK.lecithin)/tm;
  const tyM      =em*WHOLE_EGG.yolkFraction+eym;
  const tcM      =em*(1-WHOLE_EGG.yolkFraction);
  const yolkR    =tyM/(tyM+tcM);
  const sr       =eggProt/water;
  const totalR   =(eggProt+casein)/water;
  const eyf      =Math.min(1,s.extraYolks/6);
  const se       =(Math.max(0,sugarC-0.10)/0.05)*2;
  const surf     =getSurfaceTemp(s.ovenTemp,method);
  const tts      =getTimeToSet(s.ovenTemp,mold,method);
  const dt       =s.animating?s.currentTime:s.time;
  const cT       =getCenterTemp(s.ovenTemp,mold,method,dt);
  const tf       =Math.min(1,dt/Math.max(tts,1));
  const cm={};
  PROTEINS.forEach(p=>{
    const base=getCoagulation(p,cT,se,eyf);
    cm[p.id]=(!p.structural)?base:base*tf;
  });
  const tex=getTexture(cm,sr,eyf,cT,dt,tts);
  return{mold,method,em,eym,tm,water,eggProt,casein,fat,sugarC,lecithin,yolkR,sr,totalR,eyf,se,surf,tts,dt,cT,cm,tex,tts};
}

// ═══════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════
function render(){
  const d=derive(state);
  document.getElementById('app').innerHTML=buildHTML(d);
  attachEvents(d);
}

function buildHTML(d){
  return `
<div style="min-height:100vh;background:linear-gradient(135deg,#0f0a04 0%,#1a1005 50%,#0d0d1a 100%);padding:0 0 80px 0">

  <!-- HEADER -->
  <div style="text-align:center;padding:20px 16px 12px;background:linear-gradient(180deg,rgba(15,10,4,0.95),transparent)">
    <div class="mono" style="font-size:9px;letter-spacing:4px;color:#f5c84244;text-transform:uppercase;margin-bottom:4px">Simulador Científico-Repostero</div>
    <h1 style="font-family:'Playfair Display',serif;font-size:28px;background:linear-gradient(135deg,#f5c842,#f0e6d3,#f5c842);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px">Cinética del Flan</h1>
    <div style="font-size:10px;color:#6b7280;margin-top:4px;font-style:italic">Huevo L · QA validado · Offline</div>
  </div>

  <!-- TABS -->
  <div style="display:flex;gap:8px;padding:0 14px 12px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0f0a04 80%,transparent)">
    <button class="tab-btn" id="tab-params"
      style="background:${state.tab==='params'?'rgba(245,200,66,0.18)':'rgba(255,255,255,0.05)'};border:1px solid ${state.tab==='params'?'rgba(245,200,66,0.5)':'rgba(255,255,255,0.1)'};color:${state.tab==='params'?'#f5c842':'#9ca3af'}">
      ⚗️ Parámetros
    </button>
    <button class="tab-btn" id="tab-results"
      style="background:${state.tab==='results'?`${d.tex.color}22`:'rgba(255,255,255,0.05)'};border:1px solid ${state.tab==='results'?`${d.tex.color}55`:'rgba(255,255,255,0.1)'};color:${state.tab==='results'?d.tex.color:'#9ca3af'}">
      ${d.tex.emoji} Resultados
    </button>
  </div>

  <div style="padding:0 14px">
  ${state.tab==='params' ? buildParams(d) : buildResults(d)}
  </div>

  <!-- SIMULATE BUTTON (always visible) -->
  <div style="position:fixed;bottom:0;left:0;right:0;padding:12px 14px;background:linear-gradient(180deg,transparent,#0f0a04 40%);z-index:20">
    <button class="sim-btn" id="sim-btn"
      style="background:${state.animating?'rgba(245,200,66,0.1)':'linear-gradient(135deg,#f5c842,#f59e0b)'};color:${state.animating?'#9ca3af':'#0f0a04'}">
      ${state.animating ? `⏱ Cocinando... ${Math.round(state.currentTime)} / ${state.time} min` : '▶ Simular cocción'}
    </button>
  </div>
</div>`;
}

function buildParams(d){
  return `
  <!-- MOLDE -->
  <div class="card" style="border-color:rgba(245,200,66,0.18)">
    <div class="section-title" style="color:#f5c842">🏺 Molde</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${Object.values(MOLDS).map(m=>`
        <div data-mold="${m.id}" style="cursor:pointer;border-radius:10px;padding:10px 6px;text-align:center;background:${state.moldId===m.id?'rgba(245,200,66,0.13)':'rgba(255,255,255,0.03)'};border:1px solid ${state.moldId===m.id?'rgba(245,200,66,0.5)':'rgba(255,255,255,0.07)'}">
          <div style="font-size:22px;margin-bottom:3px">${m.icon}</div>
          <div style="font-size:10px;font-weight:700;color:${state.moldId===m.id?'#f5c842':'#9ca3af'};line-height:1.2">${m.name}</div>
          <div class="mono" style="font-size:8px;color:#4b5563;margin-top:2px">${m.desc}</div>
        </div>`).join('')}
    </div>
  </div>

  <!-- MÉTODO -->
  <div class="card" style="border-color:rgba(239,68,68,0.14)">
    <div class="section-title" style="color:#f87171">🌡️ Método</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      ${Object.values(METHODS).map(m=>{
        const c=m.id==='banomaria'?'#60a5fa':'#f97316';
        return `<div data-method="${m.id}" style="cursor:pointer;border-radius:10px;padding:12px 8px;text-align:center;background:${state.methodId===m.id?c+'18':'rgba(255,255,255,0.03)'};border:1px solid ${state.methodId===m.id?c+'55':'rgba(255,255,255,0.08)'}">
          <div style="font-size:24px;margin-bottom:4px">${m.icon}</div>
          <div style="font-size:12px;font-weight:700;color:${state.methodId===m.id?c:'#9ca3af'}">${m.name}</div>
        </div>`;
      }).join('')}
    </div>
    ${slider('ovenTemp','TEMPERATURA',state.ovenTemp,60,200,5,'°C','#f87171', state.methodId==='banomaria'?'(máx efectivo ~95°C)':'(horno seco)')}
    ${slider('time','TIEMPO',state.time,5,90,5,' min','#fb923c')}
  </div>

  <!-- INGREDIENTES -->
  <div class="card" style="border-color:rgba(134,239,172,0.12)">
    <div class="section-title" style="color:#86efac">🥚 Ingredientes</div>
    ${slider('eggs','HUEVOS ENTEROS',state.eggs,1,8,1,' uds','#f5c842','huevo L',d.em+' g')}
    ${slider('milk','LECHE',state.milk,100,800,50,' ml','#86efac')}
    ${slider('sugar','AZÚCAR',state.sugar,50,300,10,' g','#f0e6d3')}
  </div>

  <!-- YEMAS EXTRA -->
  <div class="card" style="border-color:rgba(251,146,60,0.28);background:rgba(251,146,60,0.05)">
    <div class="section-title" style="color:#fb923c">🟡 Yemas adicionales</div>
    <div style="font-size:10px;color:#6b7280;font-style:italic;margin-bottom:10px">Sin clara · grasa, lecitina y proteína de yema</div>
    ${slider('extraYolks','YEMAS EXTRA',state.extraYolks,0,10,1,' uds','#fb923c','', state.extraYolks>0?d.eym+' g':null)}
    ${state.extraYolks>0?`
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 12px">
      ${Array.from({length:Math.min(state.extraYolks,10)}).map(()=>`<div style="width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fde68a,#f5c842);border:1px solid #d97706;box-shadow:0 1px 4px rgba(245,200,66,0.4)"></div>`).join('')}
      ${state.extraYolks>10?`<span style="font-size:9px;color:#f5c842;font-family:monospace;align-self:center">+${state.extraYolks-10}</span>`:''}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      ${[
        {l:'Lecitina',   v:`+${(d.lecithin*100).toFixed(1)}%`, c:'#fb923c'},
        {l:'Grasa yema', v:`+${(d.eym*EXTRA_YOLK.fat/d.tm*100).toFixed(1)}%`, c:'#f5c842'},
        {l:'Yema/Clara', v:`${(d.yolkR*100).toFixed(0)}%`,     c:'#fde68a'},
      ].map(x=>`<div style="background:rgba(0,0,0,0.2);border-radius:8px;padding:6px;text-align:center">
        <div class="mono" style="font-size:13px;font-weight:700;color:${x.c}">${x.v}</div>
        <div class="mono" style="font-size:9px;color:#6b7280;margin-top:1px">${x.l}</div>
      </div>`).join('')}
    </div>`:''}
  </div>

  <!-- COMPOSICIÓN -->
  <div class="card">
    <div class="mono" style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Composición calculada</div>
    ${proteinSplitBar(d.eggProt, d.casein)}
    ${[
      {label:'Agua',    value:d.water,   color:'#60a5fa',ideal:[0.70,0.75]},
      {label:'Grasa',   value:d.fat,     color:'#f5c842',ideal:[0.03,0.08]},
      {label:'Azúcar',  value:d.sugarC,  color:'#f0e6d3',ideal:[0.12,0.18]},
      {label:'Lecitina',value:d.lecithin,color:'#fb923c',ideal:[0.005,0.025]},
    ].map(item=>{
      const ok=item.value>=item.ideal[0]&&item.value<=item.ideal[1];
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="mono" style="font-size:10px;color:#6b7280;width:55px">${item.label}</span>
        <div style="flex:1;background:rgba(0,0,0,0.3);border-radius:10px;height:5px;overflow:hidden">
          <div style="height:100%;width:${Math.min(100,item.value*100)}%;background:${item.color};border-radius:10px;opacity:${ok?1:0.35};transition:width 0.4s"></div>
        </div>
        <span class="mono" style="font-size:10px;color:${ok?item.color:'#ef4444'};width:40px;text-align:right">${(item.value*100).toFixed(1)}%</span>
        <span style="font-size:10px">${ok?'✓':item.value<item.ideal[0]?'↓':'↑'}</span>
      </div>`;
    }).join('')}
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)">
      ${ratioBlock(d)}
    </div>
  </div>`;
}

function buildResults(d){
  const tts=d.tts, ratioColor=d.sr<T_CREMOSO_MAX?'#34d399':d.sr<T_FIRME_MAX?'#fbbf24':'#ef4444';
  return `
  <!-- TEXTURE -->
  <div class="card" style="background:linear-gradient(135deg,${d.tex.color}0c,${d.tex.color}1a);border-color:${d.tex.color}44;text-align:center;padding:20px">
    <div style="font-size:44px;margin-bottom:8px">${d.tex.emoji}</div>
    <div style="font-family:'Playfair Display',serif;font-size:26px;color:${d.tex.color};font-weight:700">${d.tex.label}</div>
    <div class="mono" style="font-size:10px;color:#6b7280;margin-top:6px">${d.tex.set?`${state.time} min · ${state.ovenTemp}°C · ${d.mold.name}`:''}</div>
    ${d.tex.set?`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <div style="background:rgba(255,255,255,0.05);border-radius:10px;padding:8px">
        <div class="mono" style="font-size:9px;color:#6b7280">textura ← ratio</div>
        <div class="mono" style="font-size:16px;font-weight:700;color:${ratioColor}">${d.sr.toFixed(3)}</div>
      </div>
      <div style="background:rgba(255,255,255,0.05);border-radius:10px;padding:8px">
        <div class="mono" style="font-size:9px;color:#6b7280">sobrecocción</div>
        <div class="mono" style="font-size:16px;font-weight:700;color:${isOvercooked(d.cT,d.dt,tts)?'#ef4444':isRisky(d.cT,d.dt,tts)?'#f97316':'#34d399'}">
          ${isOvercooked(d.cT,d.dt,tts)?'Sí':isRisky(d.cT,d.dt,tts)?'Riesgo':'No'}
        </div>
      </div>
    </div>`:''}
    ${state.animating||state.currentTime>0?`
    <div style="margin-top:12px">
      <div style="background:rgba(0,0,0,0.3);border-radius:20px;height:4px;overflow:hidden">
        <div style="height:100%;width:${(state.currentTime/state.time)*100}%;background:${d.tex.color};border-radius:20px;transition:width 0.1s linear"></div>
      </div>
      <div class="mono" style="font-size:9px;color:#6b7280;margin-top:3px">${Math.round(state.currentTime)}/${state.time} min</div>
    </div>`:''}
  </div>

  <!-- THERMAL MAP -->
  <div class="card">
    <div class="section-title" style="color:#f0e6d3">🌡️ Mapa térmico</div>
    <div style="display:flex;justify-content:space-around;align-items:center;margin-bottom:12px">
      ${moldDiagram(d.mold, d.cT, d.surf)}
      <div style="display:flex;gap:12px;align-items:flex-end">
        ${thermometer('Horno',Math.min(state.ovenTemp,d.method.maxSurfaceTemp),200)}
        ${thermometer('Superficie',d.surf,200)}
        ${thermometer('Centro',d.cT,110)}
      </div>
    </div>
    <div style="background:${tts<=state.time?'rgba(52,211,153,0.06)':'rgba(239,68,68,0.06)'};border:1px solid ${tts<=state.time?'rgba(52,211,153,0.2)':'rgba(239,68,68,0.2)'};border-radius:9px;padding:9px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="mono" style="font-size:10px;color:#6b7280">Tiempo para cuajar centro</span>
        <span class="mono" style="font-size:15px;font-weight:700;color:${tts<=state.time?'#34d399':'#ef4444'}">${tts>=121?'>120':tts} min</span>
      </div>
      <div style="background:rgba(0,0,0,0.3);border-radius:20px;height:4px;overflow:hidden;margin-top:6px">
        <div style="height:100%;width:${Math.min(100,(state.time/Math.max(tts,state.time))*100)}%;background:${tts<=state.time?'#34d399':'#ef4444'};border-radius:20px;transition:width 0.4s"></div>
      </div>
      <div class="mono" style="font-size:8px;color:#374151;margin-top:3px">${d.mold.name} · ${d.method.name} · ${state.ovenTemp}°C</div>
    </div>
  </div>

  <!-- COAGULATION BARS -->
  <div class="card">
    <div class="section-title" style="color:#f0e6d3">Estado de coagulación</div>
    <div style="font-size:10px;color:#6b7280;font-style:italic;margin-bottom:10px">Temperatura de centro · rangos óptimos marcados</div>
    ${PROTEINS.map(p=>coagBar(p, d.cm[p.id], d.se)).join('')}
  </div>

  <!-- ALERTS -->
  <div class="card">
    <div class="mono" style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Alertas del sistema</div>
    ${buildAlerts(d)}
  </div>`;
}

// ─── HTML HELPERS ────────────────────────────────────────────────────────────

function slider(key, label, value, min, max, step, unit, color, sub='', gramLabel=null){
  return `<div style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <div>
        <span class="mono" style="font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:1px">${label}</span>
        ${sub?`<span style="font-size:10px;color:#4b5563;margin-left:5px">${sub}</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <span class="mono" style="font-size:15px;font-weight:700;color:${color}">${value}${unit}</span>
        ${gramLabel?`<span class="mono pill" style="background:rgba(255,255,255,0.06);color:#4b5563">${gramLabel}</span>`:''}
      </div>
    </div>
    <input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${value}" style="accent-color:${color}">
    <div style="display:flex;justify-content:space-between;margin-top:1px">
      <span class="mono" style="font-size:8px;color:#374151">${min}${unit}</span>
      <span class="mono" style="font-size:8px;color:#374151">${max}${unit}</span>
    </div>
  </div>`;
}

function proteinSplitBar(eggPct, caseinPct){
  const ew=Math.min(100,eggPct*100), cw=Math.min(100-ew,caseinPct*100);
  return `<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <span class="mono" style="font-size:10px;color:#6b7280">Proteína</span>
      <div style="display:flex;gap:10px">
        <span class="mono" style="font-size:10px;color:#34d399">huevo ${(eggPct*100).toFixed(1)}% ✦</span>
        <span class="mono" style="font-size:10px;color:#86efac44">caseína ${(caseinPct*100).toFixed(1)}%</span>
      </div>
    </div>
    <div style="background:rgba(0,0,0,0.3);border-radius:10px;height:8px;overflow:hidden;display:flex">
      <div style="height:100%;width:${ew}%;background:linear-gradient(90deg,#34d39966,#34d399);transition:width 0.4s"></div>
      <div style="height:100%;width:${cw}%;background:#86efac22;transition:width 0.4s"></div>
    </div>
    <div class="mono" style="font-size:8px;color:#374151;margin-top:3px">✦ solo proteína de huevo forma el gel</div>
  </div>`;
}

function ratioBlock(d){
  const rc=d.sr<T_CREMOSO_MAX?'#34d399':d.sr<T_FIRME_MAX?'#fbbf24':'#ef4444';
  const rl=d.sr<T_CREMOSO_MAX?'cremoso':d.sr<T_FIRME_MAX?'firme':'duro';
  return `<div style="background:${rc}0d;border:1px solid ${rc}22;border-radius:8px;padding:8px 10px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="mono" style="font-size:10px;color:${rc};font-weight:700">Ratio estructurante / agua</div>
        <div class="mono" style="font-size:8px;color:#374151">solo proteína de huevo</div>
      </div>
      <span class="mono" style="font-size:16px;font-weight:700;color:${rc}">${d.sr.toFixed(3)} <span style="font-size:10px">(${rl})</span></span>
    </div>
  </div>
  ${[
    {l:'Vol. mezcla',      v:`~${Math.round(d.tm)} ml`,                                       c:'#60a5fa'},
    {l:'Masa huevo total', v:`${d.em+d.eym} g`,                                               c:'#f5c842'},
    {l:'Yema / Clara',     v:`${(d.yolkR*100).toFixed(0)}% / ${((1-d.yolkR)*100).toFixed(0)}%`, c:'#fb923c'},
    {l:'Efecto azúcar ΔTª',v:`+${d.se.toFixed(1)}°C`,                                         c:'#f0e6d3'},
  ].map(r=>`<div style="display:flex;justify-content:space-between;margin-bottom:3px">
    <span class="mono" style="font-size:9px;color:#4b5563">${r.l}</span>
    <span class="mono" style="font-size:10px;font-weight:600;color:${r.c}">${r.v}</span>
  </div>`).join('')}`;
}

function thermometer(label, temp, maxTemp){
  const pct=Math.max(0,Math.min(100,((temp-20)/(maxTemp-20))*100));
  const color=temp<65?'#60a5fa':temp<75?'#34d399':temp<85?'#fbbf24':'#ef4444';
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
    <span class="mono" style="font-size:8px;color:#6b7280;text-align:center;max-width:40px;line-height:1.2">${label}</span>
    <div style="width:22px;height:88px;background:rgba(0,0,0,0.3);border-radius:11px;border:1px solid rgba(255,255,255,0.09);position:relative;overflow:hidden">
      <div style="position:absolute;bottom:0;left:0;right:0;height:${pct}%;background:linear-gradient(0deg,${color}99,${color});border-radius:0 0 11px 11px;transition:height 0.5s ease"></div>
    </div>
    <span class="mono" style="font-size:12px;color:${color};font-weight:700">${Math.round(temp)}°C</span>
  </div>`;
}

function moldDiagram(mold, cT, surf){
  const isC=mold.shape==='cone';
  const sc=surf>85?'#ef4444':surf>75?'#fbbf24':'#34d399';
  const cc=cT>85?'#ef4444':cT>75?'#fbbf24':cT>65?'#a3e635':'#60a5fa';
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div class="mono" style="font-size:8px;color:#6b7280;text-transform:uppercase;letter-spacing:1px">Sección</div>
    <svg width="80" height="72" viewBox="0 0 80 72">
      <defs><radialGradient id="tg2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${cc}" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="${sc}" stop-opacity="0.55"/>
      </radialGradient></defs>
      ${isC?`<polygon points="40,4 68,68 12,68" fill="url(#tg2)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>`
           :`<rect x="10" y="6" width="60" height="60" rx="4" fill="url(#tg2)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>`}
      <circle cx="40" cy="${isC?49:36}" r="5" fill="${cc}" opacity="0.9"/>
    </svg>
    <div style="display:flex;gap:10px">
      ${[{l:'sup',t:surf,c:sc},{l:'centro',t:cT,c:cc}].map(x=>`
      <div style="text-align:center">
        <div class="mono" style="font-size:11px;color:${x.c};font-weight:700">${Math.round(x.t)}°C</div>
        <div class="mono" style="font-size:8px;color:#4b5563">${x.l}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function coagBar(protein, level, se){
  const passive=!protein.structural;
  const isLec=protein.id==='lecithin', isCas=protein.id==='casein';
  const pct=Math.round(level*100);
  const hasRange=protein.optimalMin!=null;
  const inRange=hasRange&&pct>=protein.optimalMin&&pct<=protein.optimalMax;
  const tooHigh=hasRange&&pct>protein.optimalMax;
  const tooLow =hasRange&&pct<protein.optimalMin&&pct>0;
  const sc=!hasRange?'#6b7280':inRange?'#34d399':tooHigh?'#ef4444':tooLow?'#f5c842':'#6b7280';
  const bg=isLec?'rgba(251,146,60,0.07)':isCas?'rgba(134,239,172,0.04)':'rgba(255,255,255,0.04)';
  const bdr=isLec?'rgba(251,146,60,0.22)':isCas?'rgba(134,239,172,0.14)':tooHigh?'rgba(239,68,68,0.25)':inRange?'rgba(52,211,153,0.2)':'rgba(255,255,255,0.08)';
  const statusMsg=tooHigh&&protein.highMsg?`⚠ ${protein.highMsg}`:inRange?`✓ en rango óptimo`:tooLow&&protein.lowMsg?`↑ ${protein.lowMsg}`:'';
  return `<div style="background:${bg};border:1px solid ${bdr};border-radius:10px;padding:11px 12px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
        <span style="font-family:'Playfair Display',serif;font-size:13px;color:#f0e6d3;font-weight:600">${protein.name}</span>
        <span class="pill" style="background:${isLec?'rgba(251,146,60,0.14)':isCas?'rgba(134,239,172,0.1)':'rgba(255,255,255,0.08)'};color:${isLec?'#fb923c':isCas?'#86efac':'#9ca3af'}">${protein.source}</span>
        ${passive?`<span class="pill" style="background:rgba(255,255,255,0.03);color:#374151">pasiva</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${hasRange?`<span class="mono" style="font-size:8px;color:#4b5563">óptimo:${protein.optimalMin}–${protein.optimalMax}%</span>`:''}
        <span class="mono" style="font-size:15px;font-weight:700;color:${sc}">${pct}%</span>
      </div>
    </div>
    <!-- Bar with optimal zone -->
    <div style="position:relative">
      <div style="background:rgba(0,0,0,0.3);border-radius:20px;height:9px;overflow:hidden;position:relative">
        ${hasRange?`<div style="position:absolute;top:0;bottom:0;left:${protein.optimalMin}%;width:${protein.optimalMax-protein.optimalMin}%;background:rgba(52,211,153,0.13);border-left:1px solid rgba(52,211,153,0.35)${protein.optimalMax<100?';border-right:1px solid rgba(52,211,153,0.35)':''}"></div>`:''}
        <div style="height:100%;width:${pct}%;background:${tooHigh?`linear-gradient(90deg,${protein.color}55,#ef444488)`:`linear-gradient(90deg,${protein.color}55,${protein.color}${passive?'66':''})`};border-radius:20px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1);position:relative;z-index:1;box-shadow:${pct>30&&!passive?`0 0 7px ${sc}44`:'none'}"></div>
      </div>
    </div>
    <!-- Status and note -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:5px">
      <div>
        <div class="mono" style="font-size:8px;color:#4b5563">${passive?'Pasivo — no coagula térmicamente':`Inicio: ${protein.startTemp+Math.round(se)}°C → Completo: ${protein.fullTemp+Math.round(se)}°C`}</div>
        ${statusMsg?`<div class="mono" style="font-size:9px;color:${sc};font-weight:600;margin-top:2px">${statusMsg}</div>`:''}
      </div>
      <span class="mono" style="font-size:8px;color:#374151;text-align:right;max-width:110px;line-height:1.2">${protein.optimalNote}</span>
    </div>
  </div>`;
}

function buildAlerts(d){
  const tts=d.tts;
  const alerts=[
    {cond:!d.mold.maxCapacity||d.tm>d.mold.maxCapacity&&state.moldId!=='individual', msg:`Volumen (~${Math.round(d.tm)} ml) supera capacidad del molde`, color:'#ef4444'},
    {cond:state.moldId==='individual'&&Math.floor(d.tm/120)>=1, msg:`Esta mezcla llena ~${Math.floor(d.tm/120)} flanecito${Math.floor(d.tm/120)>1?'s':''} individual${Math.floor(d.tm/120)>1?'es':''}`, color:'#60a5fa'},
    {cond:state.methodId==='horno'&&state.moldId==='large', msg:'Horno directo + flanera grande: exterior sobrecocido antes de cuajar el centro', color:'#ef4444'},
    {cond:state.methodId==='horno', msg:'Horno directo: no recomendado para flan cremoso. Considera baño María.', color:'#f97316'},
    {cond:tts>state.time, msg:`Tiempo insuficiente — centro no alcanzará 75°C. Mínimo: ${tts} min`, color:'#ef4444'},
    {cond:tts<=state.time&&tts<121, msg:`✓ Centro alcanza temperatura de cuaje a los ~${tts} min`, color:'#34d399'},
    {cond:state.ovenTemp>95&&state.methodId==='banomaria', msg:'En baño María el agua nunca supera ~95°C aunque el termostato esté más alto', color:'#f5c842'},
    {cond:d.eggProt<T_EGG_MIN, msg:`Proteína de huevo insuficiente (${(d.eggProt*100).toFixed(1)}%) — mínimo 2.8%`, color:'#ef4444'},
    {cond:d.eggProt>=T_EGG_MIN&&d.eggProt<T_EGG_WARN, msg:`Proteína de huevo en límite (${(d.eggProt*100).toFixed(1)}%) — textura muy delicada`, color:'#f5c842'},
    {cond:d.sr>T_FIRME_MAX, msg:`Ratio estructurante alto (${d.sr.toFixed(3)}) — riesgo textura tipo tortilla`, color:'#f97316'},
    {cond:d.sugarC>0.20, msg:'Exceso de azúcar: sube umbral de coagulación significativamente', color:'#f97316'},
    {cond:state.extraYolks>=2&&state.extraYolks<=5&&state.eggs>=2, msg:'✨ Yemas extra óptimas: perfil desplazado hacia natilla cremosa', color:'#fb923c'},
    {cond:d.sr>=0.040&&d.sr<=T_CREMOSO_MAX&&state.methodId==='banomaria'&&tts<=state.time&&!isOvercooked(d.cT,d.dt,tts)&&!isRisky(d.cT,d.dt,tts), msg:'✨ Combinación óptima: composición + molde + método + tiempo alineados', color:'#34d399'},
  ].filter(a=>a.cond);
  if(!alerts.length) return `<div class="mono" style="font-size:10px;color:#6b7280">Sistema estable. Ajusta parámetros para optimizar.</div>`;
  return alerts.map(a=>`<div class="alert" style="background:${a.color}0d;border:1px solid ${a.color}28;color:${a.color}">${a.msg}</div>`).join('');
}

// ═══════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════
function attachEvents(d){
  // Tabs
  document.getElementById('tab-params')?.addEventListener('click',()=>{state.tab='params';render();});
  document.getElementById('tab-results')?.addEventListener('click',()=>{state.tab='results';render();});

  // Sliders
  document.querySelectorAll('input[data-key]').forEach(el=>{
    el.addEventListener('input',e=>{
      const k=e.target.dataset.key;
      state[k]=Number(e.target.value);
      stopAnimation();
      render();
    });
  });

  // Mold cards
  document.querySelectorAll('[data-mold]').forEach(el=>{
    el.addEventListener('click',()=>{ state.moldId=el.dataset.mold; stopAnimation(); render(); });
  });

  // Method cards
  document.querySelectorAll('[data-method]').forEach(el=>{
    el.addEventListener('click',()=>{ state.methodId=el.dataset.method; stopAnimation(); render(); });
  });

  // Simulate button
  document.getElementById('sim-btn')?.addEventListener('click',()=>{
    if(state.animating){ stopAnimation(); return; }
    startAnimation();
  });
}

function startAnimation(){
  state.animating=true; state.currentTime=0;
  state.tab='results';
  render();
  state.animInterval=setInterval(()=>{
    state.currentTime+=0.5;
    if(state.currentTime>=state.time){ stopAnimation(); return; }
    // Partial re-render of just the dynamic parts would be ideal,
    // but full render is safe here since interval is 100ms
    render();
  },100);
}

function stopAnimation(){
  if(state.animInterval){ clearInterval(state.animInterval); state.animInterval=null; }
  state.animating=false;
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
render();

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
